<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface font-body min-h-screen flex flex-col items-center">
<!-- Top AppBar (From Shared Components JSON) -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface flex items-center justify-between px-container-padding h-touch-target-min w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="fitness_center">fitness_center</span>
<h1 class="font-section-header text-section-header uppercase tracking-widest text-primary">YA-5BX SESSION</h1>
</div>
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-surface-elevated transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="help_outline">help_outline</span>
</button>
</header>
<main class="flex-grow w-full max-w-md px-container-padding py-section-gap flex flex-col">
<!-- Progress Pips -->
<div class="flex justify-between w-full mb-10 gap-2">
<div class="h-1 flex-grow bg-primary rounded-full progress-pip-active"></div>
<div class="h-1 flex-grow bg-primary rounded-full progress-pip-active"></div>
<div class="h-1 flex-grow bg-primary rounded-full progress-pip-active"></div>
<div class="h-1 flex-grow bg-primary rounded-full progress-pip-active"></div>
<div class="h-1 flex-grow bg-primary rounded-full progress-pip-active"></div>
<div class="h-1 flex-grow bg-primary rounded-full progress-pip-active"></div>
</div>
<!-- Hero Header -->
<div class="mb-8">
<h2 class="font-exercise-name text-exercise-name uppercase text-primary leading-none mb-2">ONE LAST THING</h2>
<p class="font-body text-text-secondary">Personalize your training record before we begin the baseline assessment.</p>
</div>
<!-- Name Input -->
<div class="mb-10 group">
<label class="block font-caption text-caption text-text-tertiary mb-2 uppercase tracking-widest" for="user-name">Your name (Optional)</label>
<div class="relative">
<input class="w-full bg-surface-container border-2 border-surface-variant focus:border-primary text-on-surface font-body-emphasis rounded-lg px-4 h-touch-target-min outline-none transition-all placeholder:text-surface-variant" id="user-name" placeholder="RECRUIT NAME" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-surface-variant group-focus-within:text-primary" data-icon="badge">badge</span>
</div>
</div>
<!-- Summary Bento Grid -->
<div class="mb-12">
<h3 class="font-section-header text-section-header text-primary uppercase mb-4">YOUR STARTING POINT</h3>
<div class="grid grid-cols-2 gap-4">
<!-- Level D- Card -->
<div class="glass-card rounded-xl p-4 flex flex-col justify-between aspect-square border-l-4 border-l-error">
<div>
<span class="font-caption text-caption text-text-secondary uppercase">Current Tier</span>
<h4 class="font-exercise-name text-exercise-name text-on-surface">CHART 1</h4>
</div>
<div class="text-right">
<span class="font-rep-target text-rep-target text-error leading-none">D-</span>
</div>
</div>
<!-- Goal A+ Card -->
<div class="glass-card rounded-xl p-4 flex flex-col justify-between aspect-square border-l-4 border-l-secondary">
<div>
<span class="font-caption text-caption text-text-secondary uppercase">Objective</span>
<h4 class="font-exercise-name text-exercise-name text-on-surface">CHART 3</h4>
</div>
<div class="text-right">
<span class="font-rep-target text-rep-target text-secondary leading-none">A+</span>
</div>
</div>
</div>
</div>
<!-- Visual Anchor (Ambient Effect) -->
<div class="relative w-full h-48 mb-8 overflow-hidden rounded-xl border border-surface-variant">

<div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
<span class="material-symbols-outlined text-primary text-[48px] mb-2" data-icon="rocket_launch">rocket_launch</span>
<p class="font-body-emphasis text-on-surface uppercase tracking-tighter">System Initialized</p>
</div>
</div>
<!-- Action Area -->
<div class="mt-auto space-y-4">
<button class="w-full bg-primary-container text-on-primary-fixed font-section-header text-exercise-name py-5 rounded-lg active:scale-95 transition-transform shadow-lg hover:brightness-110 flex items-center justify-center gap-3">
<span>START MY FIRST WORKOUT</span>
<span class="material-symbols-outlined" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="w-full py-4 font-body-emphasis text-text-secondary hover:text-primary transition-colors text-center border-2 border-transparent hover:border-primary/20 rounded-lg">
                Skip for now
            </button>
</div>
</main>
<!-- Bottom Nav (Suppressed for focused onboarding journey per Shared Components Logic) -->
<script>
        // Subtle micro-interaction for the name input
        const input = document.getElementById('user-name');
        input.addEventListener('focus', () => {
            input.parentElement.parentElement.classList.add('scale-[1.02]');
            input.parentElement.parentElement.classList.add('transition-transform');
        });
        input.addEventListener('blur', () => {
            input.parentElement.parentElement.classList.remove('scale-[1.02]');
        });

        // Simple animation trigger for the cards on load
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'all 0.5s ease-out';
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body></html>
