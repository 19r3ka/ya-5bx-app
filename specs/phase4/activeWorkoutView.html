            100% { border-color: rgba(245, 166, 35, 0.2); }

<style>

<body class="bg-surface-dim text-on-surface min-h-screen flex flex-col font-body selection:bg-primary selection:text-on-primary overflow-x-hidden">
<!-- Top App Bar (Shared Component Strategy) -->
<header class="w-full top-0 sticky z-50 bg-surface flex items-center justify-between px-container-padding h-touch-target-min max-w-screen-xl mx-auto transition-colors duration-200">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="fitness_center">fitness_center</span>
<h1 class="font-section-header text-section-header uppercase tracking-widest text-primary">YA-5BX SESSION</h1>
</div>
<!-- Progress Dots Integration -->
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<button aria-label="Pause Workout" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-surface-elevated transition-colors">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="pause_circle">pause_circle</span>
</button>
</header>
<main class="flex-grow flex flex-col px-container-padding py-section-gap max-w-screen-md mx-auto w-full relative">
<!-- Distance UI: Timer Section -->
<section class="flex flex-col items-center justify-center mb-10 text-center">
<div class="inline-block p-8 border-2 border-primary/20 rounded-2xl timer-pulse bg-surface-container-low mb-4">
<span class="font-timer-display text-timer-display text-primary-container tabular-nums" id="main-timer">01:47</span>
</div>
<h2 class="font-exercise-name text-exercise-name text-text-primary uppercase mb-2">STRETCHING</h2>
<p class="font-caption text-caption text-text-secondary uppercase tracking-[2px]">Circuit 2 of 4 • Set 1</p>
</section>
<!-- Dynamic Visualization (Bento Style Layout) -->
<div class="grid grid-cols-1 gap-gutter mb-section-gap">
<!-- Rep Stepper Card -->
<div class="bg-surface rounded-xl p-6 border-l-4 border-primary-container flex flex-col items-center justify-between">
<span class="font-section-header text-section-header text-text-secondary self-start mb-4">REPS PERFORMED</span>
<div class="flex items-center justify-center gap-12 w-full py-4">
<button aria-label="Decrease reps" class="w-stepper-button h-stepper-button rounded-xl bg-surface-elevated border-2 border-outline-variant flex items-center justify-center text-primary active:scale-95 transition-all shadow-lg shadow-black/20" onclick="decrementReps()">
<span class="material-symbols-outlined text-3xl" data-icon="remove">remove</span>
</button>
<div class="flex flex-col items-center">
<span class="font-rep-target text-rep-target text-on-surface" id="rep-count">10</span>
<span class="font-caption text-caption text-text-tertiary">CURRENT</span>
</div>
<button aria-label="Increase reps" class="w-stepper-button h-stepper-button rounded-xl bg-surface-elevated border-2 border-primary flex items-center justify-center text-primary active:scale-95 transition-all shadow-lg shadow-black/20" onclick="incrementReps()">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
</div>
</div>
<!-- Call to Action -->
<div class="mt-auto pt-6 space-y-6">
<button class="w-full h-touch-target-min bg-primary-container text-on-primary-fixed font-body-emphasis rounded-lg text-lg uppercase tracking-wider flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined font-bold" data-icon="check_circle">check_circle</span>
                LOG <span class="mx-1" id="log-rep-text">10</span> REPS
            </button>
<!-- Next Exercise Hint Card -->
<div class="bg-surface-container rounded-xl p-4 flex items-center gap-4 border border-outline-variant/30 opacity-80 group hover:opacity-100 transition-opacity">
<div class="w-16 h-16 rounded-lg bg-surface-elevated overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all" data-alt="A focused professional athlete in a dark, high-end gym setting performing high-knees. The lighting is dramatic and moody with amber highlights. Professional sports photography style, minimalist background with industrial textures." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGqeFaxT_KtFepfeCiwzsbhSEQ_WGIfasvZ7Mf1PZc17Ms0taBKwctjzMjO3MG5uBhtgvbTn13qrj28x1W_p4JWbd8fItYnqrKGOa4REKT_wV970dw6gj0g6X9wTMMmV7BFVnIb9DNfzngcdvmPH3jaCb2LNG-sRsVUWVBi95FVdWNGA0fc78ckbsC10-nz3WGmzajD3QOqybJ3TMYTwqZEF6NPk3SnPupEFez7VeFBPQHlrl29d7s7lXg30RVNi3MAiJ0AY3JWPct"/>
</div>
<div class="flex-grow">
<span class="font-caption text-caption text-text-tertiary uppercase">Up Next</span>
<h3 class="font-body-emphasis text-on-surface">HIGH KNEES</h3>
</div>
<span class="material-symbols-outlined text-text-tertiary" data-icon="arrow_forward_ios">arrow_forward_ios</span>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component Strategy - Hidden for task focus but included for shell consistency) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-safe bg-surface h-20 z-50 border-t-2 border-surface-variant md:hidden">
<a class="flex flex-col items-center justify-center text-text-secondary font-body" href="#">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
<span class="font-caption text-caption">Today</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-body-emphasis" href="#">
<span class="material-symbols-outlined fill-icon" data-icon="exercise">exercise</span>
<span class="font-caption text-caption">Workout</span>
</a>
<a class="flex flex-col items-center justify-center text-text-secondary font-body" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-caption text-caption">Progress</span>
</a>
<a class="flex flex-col items-center justify-center text-text-secondary font-body" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-caption text-caption">Settings</span>
</a>
</nav>
<script>
        let reps = 10;
        const repCountEl = document.getElementById('rep-count');
        const logRepTextEl = document.getElementById('log-rep-text');

        function updateRepDisplay() {
            repCountEl.innerText = reps;
            logRepTextEl.innerText = reps;
            
            // Micro-interaction
            repCountEl.classList.remove('scale-110');
            void repCountEl.offsetWidth; // trigger reflow
            repCountEl.classList.add('transition-transform', 'duration-100', 'scale-110');
            setTimeout(() => repCountEl.classList.remove('scale-110'), 100);
        }

        function incrementReps() {
            reps++;
            updateRepDisplay();
        }

        function decrementReps() {
            if (reps > 0) {
                reps--;
                updateRepDisplay();
            }
        }

        // Mock Timer Logic
        let totalSeconds = 107; // 01:47
        const timerEl = document.getElementById('main-timer');

        setInterval(() => {
            if(totalSeconds > 0) {
                totalSeconds--;
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                timerEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body></html>
