<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .toggle-active-primary {
            background-color: #f5a623 !important;
            color: #452b00 !important;
            border-color: #f5a623 !important;
            transform: scale(1.02);
        }

        .toggle-active-surface {
            background-color: #22263A !important;
            color: #E8EAF6 !important;
            border: 2px solid #ffc880 !important;
            transform: scale(1.02);
        }

        .countdown-bar {
            animation: shrink 10s linear forwards;
        }

        @keyframes shrink {
            from { width: 100%; }
            to { width: 0%; }
        }

        .glass-panel {
            background: rgba(26, 29, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden selection:bg-primary selection:text-on-primary">
<!-- Top AppBar (from Shared Components) -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky z-50">
<div class="flex items-center justify-between px-container-padding h-touch-target-min w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="fitness_center">fitness_center</span>
<h1 class="font-section-header text-section-header uppercase tracking-widest text-primary">YA-5BX SESSION</h1>
</div>
<button class="text-on-surface-variant hover:bg-surface-elevated transition-colors duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Safety Check-in Dialog) -->
<main class="relative h-[calc(100vh-48px)] flex flex-col items-center justify-center px-container-padding pb-24">
<!-- Subtle Background Animation -->

<div class="w-full max-w-lg z-10 space-y-section-gap">
<!-- Header Section -->
<div class="text-center space-y-2">
<p class="font-caption text-caption text-primary uppercase tracking-[0.2em]">Safety Protocol</p>
<h2 class="font-exercise-name text-exercise-name text-on-surface uppercase">How do you feel?</h2>
</div>
<!-- Massive Toggle Container -->
<div class="grid grid-cols-1 gap-gutter">
<!-- Option: Great -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-surface-container rounded-xl border-2 border-transparent transition-all duration-300 hover:bg-surface-elevated active:scale-95 h-40" id="btn-great" onclick="selectOption('great')">
<div class="text-5xl mb-3 group-hover:scale-110 transition-transform">💪</div>
<span class="font-body-emphasis text-body-lg uppercase tracking-wide">Great</span>
<div class="absolute top-4 right-4 opacity-0 transition-opacity" id="check-great">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option: Stiff/Sore -->
<button class="group relative flex flex-col items-center justify-center p-8 bg-surface-container rounded-xl border-2 border-transparent transition-all duration-300 hover:bg-surface-elevated active:scale-95 h-40" id="btn-sore" onclick="selectOption('sore')">
<div class="text-5xl mb-3 group-hover:scale-110 transition-transform">😓</div>
<span class="font-body-emphasis text-body-lg uppercase tracking-wide">Stiff or sore</span>
<div class="absolute top-4 right-4 opacity-0 transition-opacity" id="check-sore">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Follow-up (Initially Hidden) -->
<div class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500 glass-panel p-6 rounded-xl border border-surface-variant" id="follow-up">
<p class="font-body text-text-secondary mb-4">Would you like to schedule a guided mobility session for tomorrow?</p>
<div class="flex gap-3">
<button class="flex-1 py-3 px-4 bg-secondary-dim text-on-secondary-container rounded-lg font-body-emphasis hover:bg-secondary-container transition-colors">Yes, schedule</button>
<button class="flex-1 py-3 px-4 bg-surface-variant text-on-surface rounded-lg font-body-emphasis hover:bg-surface-elevated transition-colors">Maybe later</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-8">
<button class="w-full bg-primary-container text-on-primary-container py-4 px-8 rounded-lg font-body-emphasis text-body-lg shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Save &amp; continue</span>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
<!-- Ambient Image Context -->
<div class="absolute bottom-12 left-12 w-32 h-32 rounded-full overflow-hidden border-2 border-surface-variant opacity-40 hidden md:block">
<img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" data-alt="A macro close-up of high-quality gym flooring texture and a single orange dumbbell. The lighting is moody and technical, emphasizing a professional fitness environment. The color palette features deep charcoal grays and vibrant safety amber. The focus is sharp on the metallic texture of the weight." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-WxZQqX3ZvQvYl8WfX9HdRAVXISn3DTWkdrKQBZjyQO6EU0xw8_j7tX1mOwdVXt3HJ_x-XHB_GRAG3zMF5t6GEKxdvZoOtNLVUrZFYxFK3900g1G4Wm2SS6m_7A0-kCJ3gJW7x6jKQIbtGyNoOvPHLEHQf91NmeuOljgrXNt0UWHv4tCckuCKpQodZoHjpreVUyNaf2TGrW3hFA5K-BpcqcRGQIyI_nvM90x5yNZy9S3C5nR_Cq-VLHLXEq9EtFXWMM_6QPliKtRV"/>
</div>
</main>
<!-- Bottom Auto-save Countdown Bar -->
<div class="fixed bottom-0 left-0 w-full z-50">
<div class="bg-surface-container-low px-container-padding py-3 flex items-center justify-between border-t border-surface-variant">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="cloud_upload">cloud_upload</span>
<span class="font-caption text-caption uppercase tracking-wider">Auto-saving in <span class="font-timer-display" id="timer-text">10</span>s</span>
</div>
<span class="font-caption text-caption text-text-tertiary">Session ID: BX-2904</span>
</div>
<div class="h-1 bg-surface-variant w-full overflow-hidden">
<div class="countdown-bar h-full bg-primary-container shadow-[0_0_8px_rgba(245,166,35,0.5)]" id="progress-bar"></div>
</div>
</div>
<script>
        function selectOption(choice) {
            const btnGreat = document.getElementById('btn-great');
            const btnSore = document.getElementById('btn-sore');
            const checkGreat = document.getElementById('check-great');
            const checkSore = document.getElementById('check-sore');
            const followUp = document.getElementById('follow-up');

            // Reset states
            btnGreat.classList.remove('toggle-active-primary');
            btnSore.classList.remove('toggle-active-surface');
            checkGreat.classList.add('opacity-0');
            checkSore.classList.add('opacity-0');
            followUp.classList.add('hidden');

            // Set active state
            if (choice === 'great') {
                btnGreat.classList.add('toggle-active-primary');
                checkGreat.classList.remove('opacity-0');
            } else {
                btnSore.classList.add('toggle-active-surface');
                checkSore.classList.remove('opacity-0');
                followUp.classList.remove('hidden');
            }
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Timer Logic
        let seconds = 10;
        const timerText = document.getElementById('timer-text');
        const countdown = setInterval(() => {
            seconds--;
            if (seconds >= 0) {
                timerText.innerText = seconds;
            }
            if (seconds === 0) {
                clearInterval(countdown);
                // Trigger auto-save visual feedback
                document.getElementById('progress-bar').style.backgroundColor = '#4CAF50';
            }
        }, 1000);
    </script>
</body></html>
